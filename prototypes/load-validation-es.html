<style>
/* ============ OUTER CHROME TOKENS (studio, theme-aware) ============ */
:root{
  --studio-bg:#eef0f5;
  --studio-bg-2:#e3e7ef;
  --studio-ink:#132045;
  --studio-ink-soft:#5a6685;
  --studio-line:#d4dae6;
  --studio-card:#ffffff;
  --studio-accent:#306EF2;
  --studio-accent-ink:#0052CC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --studio-bg:#0d1120;
    --studio-bg-2:#141a2e;
    --studio-ink:#eef1f8;
    --studio-ink-soft:#93a0c2;
    --studio-line:#26304a;
    --studio-card:#171d33;
    --studio-accent:#6b9aff;
    --studio-accent-ink:#adc7ff;
  }
}
:root[data-theme="dark"]{
  --studio-bg:#0d1120;
  --studio-bg-2:#141a2e;
  --studio-ink:#eef1f8;
  --studio-ink-soft:#93a0c2;
  --studio-line:#26304a;
  --studio-card:#171d33;
  --studio-accent:#6b9aff;
  --studio-accent-ink:#adc7ff;
}

/* ============ DT PRODUCT TOKENS — sourced live from the design system ============
   No color values are duplicated here. colors_and_type.css (linked in <head>,
   below) is the actual dt-design-system repo's token file — this block only
   aliases those --xx names to the --dt-xx names this prototype's markup uses.
   If the design system's tokens change, this page updates with them; nothing
   here needs hand-editing to stay in sync. */
:root{
  --dt-indigo: var(--indigo);
  --dt-n1: var(--n1); --dt-n2: var(--n2); --dt-n3: var(--n3); --dt-n4: var(--n4);
  --dt-n45: var(--n4-5); --dt-n5: var(--n5); --dt-n6: var(--n6); --dt-n7: var(--n7);
  --dt-b1: var(--b1); --dt-b2: var(--b2); --dt-b6: var(--b6); --dt-b7: var(--b7);
  --dt-g1: var(--g1); --dt-g5: var(--g5); --dt-g6: var(--g6);
  --dt-r1: var(--r1); --dt-r5: var(--r5); --dt-r6: var(--r6);
  --dt-o1: var(--o1); --dt-o5: var(--o5); --dt-o7: var(--o7);
  --dt-font: var(--font-sans);
  --dt-mono:'Roboto Mono',ui-monospace,monospace; /* no mono token in the DS yet — worth adding one */
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--studio-bg);
  color:var(--studio-ink);
  font-family:var(--dt-font);
  min-height:100vh;
  padding:28px 16px 48px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}

/* ---- top chrome: title + step rail + admin toggle ---- */
.rig{width:100%;max-width:920px;display:flex;flex-direction:column;gap:16px}
.rig-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.rig-head h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.rig-head .eyebrow{font:600 11px var(--dt-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--studio-ink-soft);margin:0 0 4px}
.rig-head p{margin:4px 0 0;font-size:13px;color:var(--studio-ink-soft);max-width:56ch}

.panel{
  background:var(--studio-card);
  border:1px solid var(--studio-line);
  border-radius:14px;
  padding:14px 16px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:18px;
  justify-content:space-between;
}
.steps{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px}
.step .num{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:700 11px var(--dt-font);background:var(--studio-line);color:var(--studio-ink-soft);flex-shrink:0;transition:.2s}
.step.on .num{background:var(--studio-accent);color:#fff}
.step.done .num{background:var(--dt-g5);color:#fff}
.step .lbl{font:600 12.5px var(--dt-font);color:var(--studio-ink-soft)}
.step.on .lbl{color:var(--studio-ink)}
.step-sep{width:22px;height:1px;background:var(--studio-line);margin:0 2px}

.admin{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--studio-bg-2);border:1px solid var(--studio-line)}
.admin .txt{display:flex;flex-direction:column;line-height:1.25}
.admin .k{font:700 10.5px var(--dt-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--studio-ink-soft)}
.admin .v{font:600 12.5px var(--dt-font);color:var(--studio-ink)}
.swt{width:36px;height:21px;border-radius:999px;background:var(--studio-line);position:relative;cursor:pointer;flex-shrink:0;border:0;padding:0}
.swt.on{background:var(--dt-b6)}
.swt:after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:999px;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(19,32,69,.3)}
.swt.on:after{left:17px}
.reset-btn{font:600 12px var(--dt-font);color:var(--studio-accent-ink);background:transparent;border:1px solid var(--studio-line);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.reset-btn:hover{background:var(--studio-bg-2)}

/* ---- phone stage ---- */
.stage{
  width:100%;
  max-width:920px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.phone-wrap{
  background:linear-gradient(160deg,#2b2b2b,#141414);
  border-radius:34px;
  padding:9px;
  box-shadow:0 24px 60px rgba(10,14,30,.35),0 4px 14px rgba(10,14,30,.25);
}
:root[data-theme="light"] .phone-wrap, body:not(:has([data-theme])) .phone-wrap{}
.phone-screen{
  width:360px;
  height:718px;
  background:var(--dt-n2);
  border-radius:26px;
  overflow:hidden;
  position:relative;
  font-family:var(--dt-font);
  color:var(--dt-n7);
  display:flex;
  flex-direction:column;
}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#141414;border-radius:14px;z-index:50}
.caption{font-size:12.5px;color:var(--studio-ink-soft);text-align:center;max-width:60ch}
.caption b{color:var(--studio-ink);font-weight:700}

/* ============ APP SCREEN INTERNALS (mirrors dt-design-system.html tokens) ============ */
.scr{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:30px}
.aphdr{background:#fff;padding:14px 16px 12px;border-bottom:1px solid var(--dt-n3);flex-shrink:0}
.aphdr .row{display:flex;align-items:center;gap:10px}
.aphdr .back{width:20px;height:20px;flex-shrink:0;color:var(--dt-n7);cursor:pointer}
.aphdr h1{font-size:16.5px;font-weight:700;color:var(--dt-n7);flex:1;margin:0}
.aphdr .sub{font-size:12px;color:var(--dt-n5);margin-top:3px;margin-left:30px}
.scrbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.dtcard{background:#fff;border:1px solid var(--dt-n3);border-radius:10px}
.chk{width:19px;height:19px;border:1.5px solid var(--dt-n4);border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.12s}
.chk.on{background:var(--dt-b6);border-color:var(--dt-b6)}
.chk.locked{cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font:700 10.5px var(--dt-font)}
.badge .dot{width:4px;height:4px;border-radius:999px;background:currentColor}
.badge.bg{background:var(--dt-g1);color:var(--dt-g6)}
.badge.br{background:var(--dt-r1);color:var(--dt-r6)}
.badge.bo{background:var(--dt-o1);color:var(--dt-o7)}
.badge.bb{background:var(--dt-b1);color:var(--dt-b7)}
.badge.bn{background:var(--dt-n2);color:var(--dt-n7)}
.dtbtn{font:700 13.5px var(--dt-font);padding:13px 18px;border-radius:999px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:.12s}
.dtbtn.pri{background:var(--dt-b6);color:#fff}
.dtbtn.pri:active{background:var(--dt-b7)}
.dtbtn.sec{background:#fff;color:var(--dt-b7);border-color:var(--dt-n4)}
.sdot{width:9px;height:9px;border-radius:999px;flex-shrink:0}
.sdot.g{background:var(--dt-g5)}
.sdot.y{background:var(--dt-o5)}
.sdot.r{background:var(--dt-r5)}
.scanbtn{border:1.5px dashed var(--dt-n4);border-radius:10px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;background:#fff;cursor:pointer}
.scanbtn .row{display:flex;align-items:center;gap:9px}
.scanbtn svg{width:24px;height:24px;color:var(--dt-n6)}
.scanbtn .t{font-weight:700;font-size:14px;color:var(--dt-n7)}
.footer{padding:12px 16px 16px;background:#fff;border-top:1px solid var(--dt-n3);flex-shrink:0;display:flex;gap:8px}
.footer .dtbtn{flex:1}
.eyebrow{font:700 10.5px var(--dt-font);letter-spacing:.04em;text-transform:uppercase;color:var(--dt-n5)}
.plainlbl{font-size:13.5px;color:var(--dt-n7)}
.orderlbl{font-size:12.5px;color:var(--dt-n6);padding:2px 2px 0}
.itemcard{padding:13px;display:flex;flex-direction:column;gap:9px}
.itemcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.itemcard .name{font-weight:700;font-size:13.5px;color:var(--dt-n7);line-height:1.3}
.itemcard .sku{font-size:11.5px;color:var(--dt-n45);font-family:var(--dt-mono)}
.itemcard .qtyrow{display:flex;align-items:center;justify-content:space-between}
.itemcard .qty{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dt-n6);flex-wrap:wrap;row-gap:6px}
.status-ic{width:19px;height:19px;color:var(--dt-n45);flex-shrink:0}
.status-ic.warn{color:var(--dt-r5)}
.itemcard .qty b{color:var(--dt-n7);font-weight:700}
.itemcard.locked{opacity:.6}
.itemcard .edit{width:16px;height:16px;color:var(--dt-b6);flex-shrink:0;cursor:pointer}

/* edit item modal */
.modal-overlay{position:absolute;inset:0;background:rgba(19,32,69,.55);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:56px 16px 0;overflow-y:auto}
.edit-modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:300px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 48px rgba(19,32,69,.35);flex-shrink:0}
.edit-modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.edit-modal-header h2{font-size:16px;font-weight:800;color:var(--dt-n7);line-height:1.3;text-transform:uppercase;letter-spacing:-.01em}
.modal-close{background:none;border:0;color:var(--dt-n7);cursor:pointer;padding:2px;flex-shrink:0;line-height:0}
.edit-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--dt-n7)}
.edit-row b{font-size:16px;font-weight:800}
.stepper{display:flex;align-items:center;border:1px solid var(--dt-n4);border-radius:8px;overflow:hidden}
.stepper button{width:32px;height:30px;background:#fff;border:0;border-left:1px solid var(--dt-n4);font-size:17px;color:var(--dt-n6);cursor:pointer;line-height:0}
.stepper button:first-child{border-left:0;border-right:1px solid var(--dt-n4)}
.stepper button:disabled{color:var(--dt-n4);cursor:not-allowed}
.stepper .val{width:32px;text-align:center;font-weight:700;font-size:14px;color:var(--dt-n7)}
.comment-input{border:1px solid var(--dt-n4);border-radius:8px;padding:11px 12px;font:400 13.5px var(--dt-font);color:var(--dt-n7);resize:none;height:72px;width:100%}
.comment-input::placeholder{color:var(--dt-n45)}
.photo-block{display:flex;flex-direction:column;gap:8px}
.photo-lbl{font-size:13.5px;color:var(--dt-n7)}
.photobox{border:1.5px dashed var(--dt-n4);border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dt-n6);cursor:pointer;font-size:13px;font-weight:700;text-align:center}
.modal-actions{display:flex;gap:10px}
.modal-actions .dtbtn{flex:1}

/* summary screen */
.orow2{padding:13px;display:flex;align-items:center;gap:9px;cursor:pointer}
.orow2 .txt{flex:1;font-weight:700;font-size:13.5px;color:var(--dt-n7)}
.orow2 .frac{font-weight:700;font-size:12.5px}
.orow2 .frac.g{color:var(--dt-g6)}
.orow2 .frac.y{color:var(--dt-o7)}
.orow2 .frac.r{color:var(--dt-r6)}
.chev{width:14px;height:14px;color:var(--dt-n45);transition:.15s}
.chev.open{transform:rotate(180deg)}
.subitem{padding:9px 13px 9px 34px;display:flex;justify-content:space-between;font-size:12px;color:var(--dt-n6);border-top:1px solid var(--dt-n2)}
.subitem .pend{color:var(--dt-r6);font-weight:700}
.subitem .ok{color:var(--dt-g6);font-weight:700}

/* on-route screen — ported directly from dt-design-system's mMapListDemoPhone()
   + initMobileSheetDemo() (renderers.js / index.html, #mobile-screen-map-list).
   Real Leaflet map (CARTO light tiles) + the exact 3-state pointer-drag sheet.
   Component markup below (DtmMeta/DtmChip/DtmPin/DtmOrderCard/DTMBottomSheet)
   mirrors the DS's mMeta/mChip/mPin/mOrderCard functions' inline styles —
   only converted from template-string HTML to JSX, values unchanged. */
.dtm-map-wrap{position:absolute;inset:0}
.dtm-map-wrap .leaflet-container{font-family:var(--dt-font)!important;background:#EDEFF2}

.toast-wrap{position:absolute;left:12px;right:12px;bottom:70px;z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(0,135,90,.97);color:#fff;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px;font:600 12px var(--dt-font);box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastin .25s ease}
.toast .ic{width:17px;height:17px;border-radius:999px;background:#fff;color:#00875A;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@keyframes toastin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* scanner modal */
.scanoverlay{position:absolute;inset:0;background:linear-gradient(180deg,#2b3040,#14161c);z-index:60;display:flex;flex-direction:column;color:#fff}
.scanoverlay .camhdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0}
.scanoverlay .camhdr h1{font-size:15px;font-weight:700;margin:0}
.scanoverlay .row{display:flex;align-items:center;gap:10px}
.scanoverlay .viewport{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.scanoverlay .frame{width:220px;height:150px;position:relative}
.scanoverlay .corner{position:absolute;width:22px;height:22px;border-color:#fff;border-style:solid}
.scanoverlay .tl{top:0;left:0;border-width:3px 0 0 3px;border-top-left-radius:8px}
.scanoverlay .tr{top:0;right:0;border-width:3px 3px 0 0;border-top-right-radius:8px}
.scanoverlay .bl{bottom:0;left:0;border-width:0 0 3px 3px;border-bottom-left-radius:8px}
.scanoverlay .br{bottom:0;right:0;border-width:0 3px 3px 0;border-bottom-right-radius:8px}
.scanoverlay .barcode{position:absolute;inset:30px 16px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 12px;transition:.2s}
.scanoverlay .barcode span{display:block;background:#111;height:56%}
.scanoverlay .barcode.flash{background:#eafff5}
.scanoverlay .msg{text-align:center;font-size:12.5px;color:rgba(255,255,255,.7);padding:0 24px 10px}
.scanoverlay .allDone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.scanoverlay .allDone .ic{width:52px;height:52px;border-radius:999px;background:var(--dt-g6);display:flex;align-items:center;justify-content:center}
.scanoverlay .allDone b{font-size:15px}
.scanoverlay .allDone span{font-size:12.5px;color:rgba(255,255,255,.65);max-width:220px}
.camftr{display:flex;gap:8px;padding:8px 16px 18px;flex-shrink:0}
.camftr .dtbtn{flex:1}
.dtbtn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
.dtbtn.scanaction{background:#fff;color:var(--dt-indigo)}

.footer-note{width:100%;max-width:920px;text-align:center;font-size:11.5px;color:var(--studio-ink-soft);padding-top:2px}
.footer-note a{color:var(--studio-accent-ink)}

@media (max-width:420px){
  .phone-screen{width:92vw;max-width:360px;height:calc(92vw * (718/360));max-height:718px}
  .map{width:100%}
}
</style>

function ScannerOverlay({orders, onVerify, onClose}){
  const [flash, setFlash] = useState(false);
  const pending = useMemo(() => {
    for (const o of orders) for (const it of o.items) if (!isDone(it)) return {order:o, item:it};
    return null;
  }, [orders]);

  const doScan = () => {
    if (!pending) return;
    setFlash(true);
    setTimeout(() => {
      onVerify(pending.order.id, pending.item.code);
      setFlash(false);
    }, 420);
  };

  return (
    <div className="scanoverlay">
      <div className="camhdr">
        <div className="row">
          <svg width="18" height="18" viewBox="0 0 32 32" fill="#fff" onClick={onClose} style={{cursor:"pointer"}}><path d="M10 16 20 6 21.4 7.4 12.8 16 21.4 24.6 20 26z"/></svg>
          <h1>Escanea ítem</h1>
        </div>
      </div>

      {pending ? (
        <>
          <div className="viewport">
            <div className="frame">
              <div className="corner tl"></div><div className="corner tr"></div><div className="corner bl"></div><div className="corner br"></div>
              <div className={"barcode" + (flash ? " flash" : "")}>
                {[3,1,2,1,4,1,2,3,1,2,1,3,2,1,4,1,2,1,3,2].map((w,i)=>(<span key={i} style={{width:w+"px"}}></span>))}
              </div>
            </div>
          </div>
          <p className="msg">Siguiente: <b style={{color:"#fff"}}>{pending.item.name}</b> — {pending.order.address}</p>
          <div className="camftr">
            <button className="dtbtn ghost" onClick={onClose}>Cancelar</button>
            <button className="dtbtn scanaction" onClick={doScan}>{flash ? "Leyendo…" : "Simular lectura"}</button>
          </div>
        </>
      ) : (
        <>
          <div className="allDone">
            <span className="ic"><CheckIcon size={22}/></span>
            <b>Todos los ítems fueron escaneados</b>
            <span>Puedes finalizar el escaneo y continuar con la validación.</span>
          </div>
          <div className="camftr">
            <button className="dtbtn pri" onClick={onClose}>Finalizar escaneo</button>
          </div>
        </>
      )}
    </div>
  );
}

function EditItemModal({item, onCancel, onConfirm}){
  const [entregado, setEntregado] = useState(item.entregado);
  const [comment, setComment] = useState(item.comment || "");
  const [photoName, setPhotoName] = useState(item.photo || null);
  const fileRef = useRef(null);

  const dec = () => setEntregado(v => Math.max(0, v - 1));
  const inc = () => setEntregado(v => Math.min(item.qty, v + 1));

  const handleFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) setPhotoName(f.name);
  };

  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="edit-modal" onClick={(e) => e.stopPropagation()}>
        <div className="edit-modal-header">
          <h2>{item.name.toUpperCase()}</h2>
          <button className="modal-close" onClick={onCancel} aria-label="Cerrar">
            <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor"><path d="M17.4141 16 24 9.4141 22.5859 8 16 14.5859 9.4143 8 8 9.4141 14.5859 16 8 22.5859 9.4143 24 16 17.4141 22.5859 24 24 22.5859 17.4141 16z"/></svg>
          </button>
        </div>

        <div className="edit-row">
          <span>Cantidad</span>
          <b>{item.qty}</b>
        </div>

        <div className="edit-row">
          <span>Entregado</span>
          <div className="stepper">
            <button onClick={dec} disabled={entregado <= 0}>−</button>
            <span className="val">{entregado}</span>
            <button onClick={inc} disabled={entregado >= item.qty}>+</button>
          </div>
        </div>

        <textarea
          className="comment-input"
          placeholder="Comentario"
          value={comment}
          onChange={(e) => setComment(e.target.value)}
        ></textarea>

        <div className="photo-block">
          <span className="photo-lbl">Foto</span>
          <div className="photobox" onClick={() => fileRef.current && fileRef.current.click()}>
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile}/>
            <svg width="22" height="22" viewBox="0 0 32 32" fill="currentColor"><path d="M29,26H3a1,1,0,0,1-1-1V8A1,1,0,0,1,3,7H9.46l1.71-2.55A1,1,0,0,1,12,4h8a1,1,0,0,1,.83.45L22.54,7H29a1,1,0,0,1,1,1V25A1,1,0,0,1,29,26ZM4,24H28V9H22a1,1,0,0,1-.83-.45L19.46,6H12.54L10.83,8.55A1,1,0,0,1,10,9H4Z"/><path d="M16,22a6,6,0,1,1,6-6A6,6,0,0,1,16,22Zm0-10a4,4,0,1,0,4,4A4,4,0,0,0,16,12Z"/></svg>
            <span>{photoName || "Agregar foto"}</span>
          </div>
        </div>

        <div className="modal-actions">
          <button className="dtbtn sec" onClick={onCancel}>Cancelar</button>
          <button className="dtbtn pri" onClick={() => onConfirm({entregado, comment, photo: photoName})}>Confirmar</button>
        </div>
      </div>
    </div>
  );
}

function ItemValidationScreen({orders, setOrders, scanMandatory, onContinue}){
  const [scannerOpen, setScannerOpen] = useState(false);
  const [editing, setEditing] = useState(null); // {orderId, code}
  const [toasts, setToasts] = useState([]);

  const flat = orders.flatMap(o => o.items);
  const verifiedCount = flat.filter(isDone).length;

  const pushToast = (text) => {
    const key = Math.random().toString(36).slice(2);
    setToasts(t => [...t, {key, text}]);
    setTimeout(() => setToasts(t => t.filter(x => x.key !== key)), 2200);
  };

  const verifyByCode = (orderId, code) => {
    setOrders(prev => prev.map(o => o.id !== orderId ? o : {
      ...o, items: o.items.map(it => it.code === code ? {...it, entregado: it.qty} : it)
    }));
    const order = orders.find(o=>o.id===orderId);
    const item = order && order.items.find(i=>i.code===code);
    if (item) pushToast(`"${item.code}" verificado — ${item.name}`);
  };

  const toggleManual = (orderId, code) => {
    if (scanMandatory) { pushToast("Este ítem requiere escaneo (config. desde escritorio)"); return; }
    setOrders(prev => prev.map(o => o.id !== orderId ? o : {
      ...o, items: o.items.map(it => it.code === code ? {...it, entregado: isDone(it) ? 0 : it.qty} : it)
    }));
  };

  const saveEdit = (orderId, code, vals) => {
    setOrders(prev => prev.map(o => o.id !== orderId ? o : {
      ...o, items: o.items.map(it => it.code === code ? {...it, ...vals} : it)
    }));
    setEditing(null);
  };

  const editingItem = editing
    ? orders.find(o => o.id === editing.orderId)?.items.find(i => i.code === editing.code)
    : null;

  return (
    <div className="scr">
      <div className="aphdr">
        <div className="row">
          <span className="back"><BackIcon/></span>
          <h1>Validación de carga</h1>
        </div>
        <div className="sub">Verifica y carga los ítems al vehículo escaneando o manualmente.</div>
      </div>

      <div className="scrbody">
        <div className="plainlbl">Escaneo de ítems</div>

        <div className="scanbtn" onClick={() => setScannerOpen(true)}>
          <div className="row">
            <ScanIcon/>
            {scanMandatory && <span className="badge bo"><span className="dot"></span>Requerido</span>}
          </div>
          <span className="t">Escanear ítems</span>
        </div>

        <div>
          <div style={{fontWeight:700,fontSize:15}}>Total ítems verificados</div>
          <div style={{fontSize:13,color:"var(--dt-n6)",marginTop:2}}>{verifiedCount} de {flat.length} completado{flat.length===1?"":"s"}</div>
        </div>

        {orders.map(o => {
          return (
            <div key={o.id} style={{display:"flex",flexDirection:"column",gap:9}}>
              <div className="orderlbl">Orden #{o.id}</div>
              {o.items.map(it => {
                const done = isDone(it);
                const locked = scanMandatory && !done;
                const partial = it.entregado > 0 && it.entregado < it.qty;
                return (
                  <div className={"dtcard itemcard" + (locked ? " locked":"")} key={it.code}>
                    <div className="top">
                      <span className="name">{it.name}</span>
                      <span className={"chk" + (done?" on":"")} onClick={() => toggleManual(o.id, it.code)}>
                        {done && <CheckIcon/>}
                      </span>
                    </div>
                    <span className="sku">SKU: {it.code}</span>
                    <div className="qtyrow">
                      <div className="qty">
                        <span>Cantidad <b>{it.qty}</b></span>
                        <span>Entregado <b>{it.entregado}</b></span>
                        {partial && <WarningIcon/>}
                        {it.photo && <PhotoIcon/>}
                        {it.comment && <CommentIcon/>}
                      </div>
                      <svg className="edit" viewBox="0 0 32 32" fill="currentColor" onClick={() => setEditing({orderId:o.id, code:it.code})}><path d="M2 26H30V28H2z"/><path d="M25.4,9c0.8-0.8,0.8-2,0-2.8c0,0,0,0,0,0l-3.6-3.6c-0.8-0.8-2-0.8-2.8,0c0,0,0,0,0,0l-15,15V24h6.4L25.4,9z M20.4,4L24,7.6 l-3,3L17.4,7L20.4,4z M6,22v-3.6l10-10l3.6,3.6l-10,10H6z"/></svg>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      <div className="footer">
        <button className="dtbtn pri" onClick={onContinue}>Continuar</button>
      </div>

      {toasts.length > 0 && <Toast items={toasts}/>}
      {scannerOpen && <ScannerOverlay orders={orders} onVerify={verifyByCode} onClose={() => setScannerOpen(false)}/>}
      {editingItem && (
        <EditItemModal
          item={editingItem}
          onCancel={() => setEditing(null)}
          onConfirm={(vals) => saveEdit(editing.orderId, editing.code, vals)}
        />
      )}
    </div>
  );
}

function SummaryScreen({orders, onBack, onConfirm}){
  const [open, setOpen] = useState(null);

  const statusOf = (o) => {
    const v = o.items.filter(isDone).length;
    if (v === 0) return "r";
    if (v === o.items.length) return "g";
    return "y";
  };
  const qtySum = (o) => o.items.reduce((a,it)=>a+it.qty,0);
  const entregadoSum = (o) => o.items.reduce((a,it)=>a+it.entregado,0);
  const fracClass = {r:"r", y:"y", g:"g"};
  const totalV = orders.reduce((a,o)=>a+entregadoSum(o),0);
  const totalI = orders.reduce((a,o)=>a+qtySum(o),0);
  const fullyDone = orders.filter(o=>statusOf(o)==="g").length;

  return (
    <div className="scr">
      <div className="aphdr">
        <div className="row">
          <span className="back" onClick={onBack}><BackIcon/></span>
          <h1>Validación de carga</h1>
        </div>
        <div className="sub">Entrega tu dispositivo al supervisor para verificar y firmar</div>
      </div>
      <div className="scrbody">
        <div className="dtcard" style={{padding:"13px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div className="eyebrow">Estado</div>
            <div style={{fontWeight:700,fontSize:14,marginTop:2}}>{fullyDone} de {orders.length} órdenes verificadas · {totalV}/{totalI} ítems</div>
          </div>
          <div style={{width:28,height:28,borderRadius:999,background: fullyDone===orders.length ? "var(--dt-g6)" : "var(--dt-o5)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <CheckIcon size={14}/>
          </div>
        </div>

        {orders.map(o => {
          const st = statusOf(o);
          const isOpen = open === o.id;
          return (
            <div className="dtcard" key={o.id}>
              <div className="orow2" onClick={() => setOpen(isOpen ? null : o.id)}>
                <span className={"sdot " + st}></span>
                <span className="txt">Orden #{o.id}</span>
                <span className={"frac " + fracClass[st]}>{st==="r" ? "Pendiente" : `${entregadoSum(o)}/${qtySum(o)}`}</span>
                <ChevIcon open={isOpen}/>
              </div>
              {isOpen && o.items.map(it => (
                <div className="subitem" key={it.code}>
                  <span>{it.name}</span>
                  <span className={isDone(it) ? "ok" : "pend"}>{it.entregado}/{it.qty}</span>
                </div>
              ))}
            </div>
          );
        })}

        <div className="dtcard" style={{padding:"20px",borderStyle:"dashed",background:"var(--dt-n1)",display:"flex",flexDirection:"column",alignItems:"center",gap:8,textAlign:"center"}}>
          <svg width="28" height="28" viewBox="0 0 32 32" fill="var(--dt-n6)"><path d="M2 26H30V28H2z"/><path d="M25.4,9c0.8-0.8,0.8-2,0-2.8c0,0,0,0,0,0l-3.6-3.6c-0.8-0.8-2-0.8-2.8,0c0,0,0,0,0,0l-15,15V24h6.4L25.4,9z M20.4,4L24,7.6 l-3,3L17.4,7L20.4,4z M6,22v-3.6l10-10l3.6,3.6l-10,10H6z"/></svg>
          <b style={{fontSize:13.5}}>Firma del supervisor</b>
          <span style={{fontSize:11.5,color:"var(--dt-n5)",maxWidth:220}}>Disponible para el supervisor en el dispositivo físico.</span>
        </div>
      </div>
      <div className="footer">
        <button className="dtbtn sec" onClick={onConfirm}>Sin firma</button>
        <button className="dtbtn pri" onClick={onConfirm}>Confirmar</button>
      </div>
    </div>
  );
}

/* Real map — same Leaflet setup, tile source, pin SVGs and route polyline as
   initMobileSheetDemo()'s buildSheetMap(). Loaded from CDN on demand, exactly
   like the DS does (Leaflet isn't needed until this screen is reached). */
let _leafletPromise = null;
function loadLeaflet(){
  if (window.L) return Promise.resolve(window.L);
  if (_leafletPromise) return _leafletPromise;
  _leafletPromise = new Promise((resolve) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload = () => resolve(window.L);
    document.head.appendChild(s);
  });
  return _leafletPromise;
}
const DTM_PIN_PATH = "M16.5 1.5C24.78 1.5 31.5 8.22 31.5 16.5C31.5 21.44 29.11 25.82 25.43 28.55C22.61 30.67 18.58 34.04 17.66 39.48C17.56 40.05 17.08 40.5 16.5 40.5C15.92 40.5 15.44 40.05 15.34 39.48C14.42 34.04 10.39 30.67 7.56 28.55C3.88 25.82 1.5 21.44 1.5 16.5C1.5 8.22 8.22 1.5 16.5 1.5Z";
function dtmPinSvgHtml(fill, inner, sz){
  const h = Math.round(sz * 49 / 33);
  return `<div style="line-height:0;filter:drop-shadow(0 2px 3px rgba(19,32,69,.3))"><svg width="${sz}" height="${h}" viewBox="0 0 33 49"><path d="${DTM_PIN_PATH}" fill="${fill}" stroke="#fff" stroke-width="2"/>${inner}</svg></div>`;
}
function dtmOrderPinHtml(stopNum){
  const inner = `<circle cx="16.5" cy="16.5" r="10.5" fill="#fff"/><text x="16.5" y="16.5" text-anchor="middle" dominant-baseline="central" font-family="DM Sans,sans-serif" font-weight="700" font-size="11" fill="#39414D">${stopNum}</text>`;
  return dtmPinSvgHtml("#1F60ED", inner, 30);
}
function dtmDepotPinHtml(){
  return dtmPinSvgHtml("#132045", '<path d="M24 18.17V16.5L22.75 10.67H9.83L9 16.5V18.17H9.83V23.17H18.17V18.17H21.5V23.17H23.17V18.17H24ZM16.5 21.5H11.5V18.17H16.5V21.5Z" fill="#fff"/>', 34);
}
const DTM_DEPOT = [-33.420, -70.585];
const DTM_STOPS = [[-33.405,-70.575],[-33.412,-70.560],[-33.418,-70.547],[-33.398,-70.553],[-33.392,-70.566],[-33.401,-70.582]];
function RouteMap({stopCount}){
  const elRef = useRef(null);
  const mapRef = useRef(null);
  useEffect(() => {
    let cancelled = false;
    loadLeaflet().then((L) => {
      if (cancelled || !elRef.current || mapRef.current) return;
      const m = L.map(elRef.current, {center: DTM_DEPOT, zoom: 13, scrollWheelZoom:false, zoomControl:false, attributionControl:false});
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {subdomains:"abcd", maxZoom:19}).addTo(m);
      const mkIcon = (html, sz) => {
        const h = Math.round(sz * 49 / 33);
        const tipY = Math.round(h * 40.5 / 49);
        return L.divIcon({html, className:"", iconSize:[sz,h], iconAnchor:[Math.round(sz/2), tipY]});
      };
      L.marker(DTM_DEPOT, {icon: mkIcon(dtmDepotPinHtml(), 34), zIndexOffset:200}).addTo(m);
      const stops = DTM_STOPS.slice(0, Math.max(1, stopCount));
      L.polyline(stops, {color:"#1F60ED", weight:3, opacity:0.5}).addTo(m);
      stops.forEach((pos,i) => L.marker(pos, {icon: mkIcon(dtmOrderPinHtml(i+1), 30)}).addTo(m));
      mapRef.current = m;
      setTimeout(() => m.invalidateSize(), 120);
    });
    return () => { cancelled = true; };
  }, [stopCount]);
  return <div ref={elRef} className="dtm-map-wrap"/>;
}

/* Sheet drag mechanics — ported 1:1 from initMobileSheetDemo() in index.html.
   Offsets are the DS's 48/320/529 (@ its 640px demo frame) scaled to this
   prototype's 718px phone; threshold, easing and drag logic are unchanged. */
const DTM_SHEET_H = 718;
const DTM_SHEET_OFF = { full: 54, mid: 359, map: 594 };
const DTM_SHEET_LABEL = { full: "Lista completa", mid: "Media (default)", map: "Mapa completo" };
const DTM_SHEET_EASE = "transform .28s cubic-bezier(.2,.8,.3,1)";
const DTM_SHEET_THRESHOLD = 50;

function DTMBottomSheet({header, children, state, setState}){
  const sheetRef = useRef(null);
  const grabRef = useRef(null);
  const listRef = useRef(null);
  const startYRef = useRef(null);
  const stateRef = useRef(state);
  stateRef.current = state;

  const apply = (s) => {
    setState(s);
    if (sheetRef.current) {
      sheetRef.current.style.transition = DTM_SHEET_EASE;
      sheetRef.current.style.transform = `translateY(${DTM_SHEET_OFF[s]}px)`;
    }
    if (listRef.current) listRef.current.style.overflowY = s === "full" ? "auto" : "hidden";
  };
  const targetFor = (dy) => {
    const s = stateRef.current;
    if (Math.abs(dy) < DTM_SHEET_THRESHOLD) return s;
    if (dy < 0) return s === "mid" ? "full" : (s === "map" ? "mid" : "full");
    return s === "mid" ? "map" : (s === "full" ? "mid" : "map");
  };
  const dragStart = (e) => {
    startYRef.current = e.clientY;
    if (sheetRef.current) sheetRef.current.style.transition = "none";
    if (grabRef.current) grabRef.current.style.cursor = "grabbing";
    if (e.target.setPointerCapture) { try { e.target.setPointerCapture(e.pointerId); } catch(_){} }
  };
  const dragMove = (e) => {
    if (startYRef.current === null) return;
    const dy = e.clientY - startYRef.current;
    const y = Math.min(DTM_SHEET_OFF.map, Math.max(DTM_SHEET_OFF.full, DTM_SHEET_OFF[stateRef.current] + dy));
    if (sheetRef.current) sheetRef.current.style.transform = `translateY(${y}px)`;
  };
  const dragEnd = (e) => {
    if (startYRef.current === null) return;
    const dy = e.clientY - startYRef.current;
    startYRef.current = null;
    if (grabRef.current) grabRef.current.style.cursor = "grab";
    apply(targetFor(dy));
  };

  useEffect(() => {
    const grab = grabRef.current, list = listRef.current;
    if (!grab || !list) return;
    apply(stateRef.current);

    const onGrabDown = (e) => { e.preventDefault(); dragStart(e); };
    const onListDown = (e) => { if (stateRef.current === "full") return; e.preventDefault(); dragStart(e); };
    const onListMove = (e) => { if (stateRef.current !== "full" || startYRef.current !== null) dragMove(e); };

    grab.addEventListener("pointerdown", onGrabDown);
    grab.addEventListener("pointermove", dragMove);
    grab.addEventListener("pointerup", dragEnd);
    grab.addEventListener("pointercancel", dragEnd);
    list.addEventListener("pointerdown", onListDown);
    list.addEventListener("pointermove", onListMove);
    list.addEventListener("pointerup", dragEnd);
    list.addEventListener("pointercancel", dragEnd);
    return () => {
      grab.removeEventListener("pointerdown", onGrabDown);
      grab.removeEventListener("pointermove", dragMove);
      grab.removeEventListener("pointerup", dragEnd);
      grab.removeEventListener("pointercancel", dragEnd);
      list.removeEventListener("pointerdown", onListDown);
      list.removeEventListener("pointermove", onListMove);
      list.removeEventListener("pointerup", dragEnd);
      list.removeEventListener("pointercancel", dragEnd);
    };
  }, []);

  return (
    <div ref={sheetRef} style={{position:"absolute",left:0,right:0,top:0,height:DTM_SHEET_H,zIndex:500,background:"#fff",borderRadius:"16px 16px 0 0",boxShadow:"0 -2px 12px rgba(19,32,69,.18)",display:"flex",flexDirection:"column",overflow:"hidden",userSelect:"none",WebkitUserSelect:"none"}}>
      <div ref={grabRef} style={{cursor:"grab",touchAction:"none",flexShrink:0,background:"var(--dt-n1)"}}>
        <div style={{display:"flex",justifyContent:"center",padding:"8px 0 4px"}}><span style={{width:36,height:4,borderRadius:99,background:"var(--dt-n3)"}}></span></div>
        {header}
      </div>
      <div ref={listRef} style={{flex:1,overflowY:"hidden",padding:12,display:"flex",flexDirection:"column",gap:8,background:"var(--dt-n1)",touchAction:"pan-y"}}>
        {children}
      </div>
    </div>
  );
}

      <div className="footer" style={{position:"absolute",left:0,right:0,bottom:0,zIndex:700}}>

            <CheckIcon size={14} color="#00875A"/> Ruta iniciada — central notificada
          </div>

          </>
        )}
      </div>
    </div>
  );
}

function App(){
  const [step, setStep] = useState(0);
  const [scanMandatory, setScanMandatory] = useState(false);
  const [orders, setOrders] = useState(initialOrders());
  const [routeStarted, setRouteStarted] = useState(false);

  const reset = () => {
    setStep(0); setOrders(initialOrders()); setRouteStarted(false);
  };

  const stepLabels = ["Validar carga", "Confirmar y firmar", "En ruta"];

  return (
    <div className="rig">
      <div className="rig-head">
        <div>
          <p className="eyebrow">DispatchTrack Design System · Prototipo interactivo</p>
          <h1>Validación de carga pre-ruta</h1>
          <p>Flujo real de la app de conductores: validar ítems por escaneo o manualmente, confirmar el resumen por orden y despachar la ruta — construido con los tokens y componentes del design system de DispatchTrack.</p>
        </div>
        <button className="reset-btn" onClick={reset}>↺ Reiniciar demo</button>
      </div>

      <div className="panel">
        <div className="steps">
          {stepLabels.map((l,i) => (
            <React.Fragment key={l}>
              <div className={"step" + (i===step?" on":"") + (i<step?" done":"")}>
                <span className="num">{i<step ? "✓" : i+1}</span>
                <span className="lbl">{l}</span>
              </div>
              {i < stepLabels.length-1 && <div className="step-sep"></div>}
            </React.Fragment>
          ))}
        </div>
        <div className="admin">
          <div className="txt">
            <span className="k">Config. escritorio</span>
            <span className="v">Escaneo obligatorio</span>
          </div>
          <button className={"swt" + (scanMandatory?" on":"")} onClick={() => setScanMandatory(s=>!s)} aria-label="Escaneo obligatorio"></button>
        </div>
      </div>

      <div className="stage">
        <div className="phone-wrap">
          <div className="phone-screen">
            <div className="notch"></div>
            {step === 0 && (
              <ItemValidationScreen
                orders={orders}
                setOrders={setOrders}
                scanMandatory={scanMandatory}
                onContinue={() => setStep(1)}
              />
            )}
            {step === 1 && (
              <SummaryScreen orders={orders} onBack={() => setStep(0)} onConfirm={() => setStep(2)} />
            )}
            {step === 2 && (
              <OnRouteScreen orders={orders} started={routeStarted} onStart={() => setRouteStarted(true)} />
            )}
          </div>
        </div>
        <p className="caption">
          {step === 0 && <>Paso 1 — <b>Escanea o marca manualmente</b> cada ítem. Con el ajuste "Escaneo obligatorio" activo, el check manual queda bloqueado.</>}
          {step === 1 && <>Paso 2 — Cada orden muestra un <b>estado por color</b>: verde (100% validada), ámbar (parcial) o rojo (sin validar). Expandí una orden para ver el detalle.</>}
          {step === 2 && <>Paso 3 — El conductor sale a ruta con la carga validada; el equipo de despacho recibe la notificación en el mismo instante. Tocá el handle del bottom sheet para alternar entre sus <b>3 alturas</b> (mapa completo → media → lista completa).</>}
        </p>
      </div>

      <p className="footer-note">Prototipo funcional construido sobre los tokens y componentes de DispatchTrack Design System — no representa datos reales de producción.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
