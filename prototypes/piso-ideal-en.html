<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piso Ideal — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#17191c;--m1:#4f545b;--m2:#6b7078;--m3:#9aa0a8;--m4:#4a4f57;
  --line:#ecedef;--hero:#f2f8e0;--dark:#1e1f22;--lime:#c9ed5b;--cream:#f6f2e9;
  --chip:#f1f3f5;--cmr-bg:#e7f0e9;--cmr-tx:#2e6b49;--field:#edeff1;
  --green:#2e6b49;--warn-bg:#faf1d8;--warn-tx:#8a6d2f;--req-bg:#f6ead0;--req-tx:#9a6a1e;
  --sh-card:0 2px 8px rgba(20,22,26,.05),0 1px 2px rgba(20,22,26,.04);
  --sh-hero:0 4px 12px rgba(20,22,26,.07),0 20px 48px -16px rgba(20,22,26,.16);
  --sh-prod:0 2px 6px rgba(20,22,26,.05),0 8px 24px -8px rgba(20,22,26,.12);
  --studio-bg:#eef0f5;--studio-bg2:#e3e7ef;--studio-ink:#132045;--studio-soft:#5a6685;
  --studio-line:#d4dae6;--studio-card:#fff;--studio-accent:#17191c;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --studio-bg:#0d1120;--studio-bg2:#141a2e;--studio-ink:#eef1f8;--studio-soft:#93a0c2;--studio-line:#26304a;--studio-card:#171d33;--studio-accent:#c9ed5b;}}
body{background:var(--studio-bg);color:var(--studio-ink);font-family:Inter,sans-serif;min-height:100vh;
  padding:26px 16px 46px;display:flex;flex-direction:column;align-items:center;gap:20px}
.rig{width:100%;max-width:940px;display:flex;flex-direction:column;gap:16px}
.rig-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.rig-head .eyebrow{font:600 11px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--studio-soft);margin:0 0 4px}
.rig-head h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.rig-head p{margin:5px 0 0;font-size:13px;color:var(--studio-soft);max-width:60ch;line-height:1.5}
.reset-btn{font:600 12px Inter;color:var(--studio-ink);background:transparent;border:1px solid var(--studio-line);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.reset-btn:hover{background:var(--studio-bg2)}
.panel{background:var(--studio-card);border:1px solid var(--studio-line);border-radius:14px;padding:12px 15px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between}
.steps{display:flex;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px}
.step .num{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:700 11px Inter;background:var(--studio-line);color:var(--studio-soft);flex-shrink:0;transition:.2s}
.step.on .num{background:var(--studio-accent);color:#fff}
.step.done .num{background:#2e6b49;color:#fff}
.step .lbl{font:600 12.5px Inter;color:var(--studio-soft)}
.step.on .lbl{color:var(--studio-ink)}
.step-sep{width:16px;height:1px;background:var(--studio-line)}
.scn{display:flex;flex-wrap:wrap;gap:8px}
.scn .sw{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:10px;background:var(--studio-bg2);border:1px solid var(--studio-line);cursor:pointer}
.scn .sw .k{font:600 11.5px Inter;color:var(--studio-ink)}
.toggle{width:34px;height:20px;border-radius:999px;background:#c3ccdd;position:relative;flex-shrink:0;transition:.15s}
.toggle.on{background:#2e6b49}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on::after{left:16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.phone-wrap{filter:drop-shadow(0 30px 60px rgba(19,32,69,.28))}
.phone{width:360px;height:800px;background:#fff;border-radius:30px;overflow:hidden;position:relative;
  font-family:Inter,sans-serif;color:var(--ink);display:flex;flex-direction:column;border:7px solid #0d0f12}
.notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#0d0f12;border-radius:0 0 16px 16px;z-index:60}
.serif{font-family:Fraunces,serif;font-variation-settings:"SOFT" 0,"WONK" 1}
svg,img{display:block}
.caption{font-size:12.5px;color:var(--studio-soft);text-align:center;max-width:62ch;line-height:1.5}
.caption b{color:var(--studio-ink);font-weight:700}
.footnote{width:100%;max-width:940px;text-align:center;font-size:11.5px;color:var(--studio-soft)}

/* ====== APP (inside phone) ====== */
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.status{height:42px;display:flex;align-items:center;justify-content:space-between;padding:6px 22px 0;flex:0 0 auto}
.status .t{font-weight:600;font-size:14px;letter-spacing:.14px}
.status .ic{display:flex;gap:6px;align-items:center}
.topbar{display:flex;gap:8px;align-items:center;padding:6px 14px 10px;flex:0 0 auto}
.ibtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:none;border:0;cursor:pointer}
.topbar .title{font-weight:600;font-size:16px;color:var(--ink);white-space:nowrap}
.topbar .sp{flex:1}
.topbar .grp{display:flex;gap:2px;align-items:center}
.cartbadge{position:relative}
.cartbadge .b{position:absolute;top:-2px;right:-1px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--lime);color:#17191c;font:700 9px Inter;display:flex;align-items:center;justify-content:center}
.search{flex:1;min-width:0;height:42px;display:flex;gap:9px;align-items:center;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh-card)}
.search .q{flex:1;min-width:0;font-weight:500;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{padding:0 16px 14px;flex:0 0 auto}
.progress .track{height:5px;background:var(--line);border-radius:999px;overflow:hidden}
.progress .fill{height:5px;background:var(--dark);border-radius:999px;transition:width .4s cubic-bezier(.3,.8,.3,1)}
.scrbody{flex:1;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.scrbody>*{flex-shrink:0}
.scrbody.nopad{padding:0}
.footer{padding:12px 16px 16px;background:#fff;border-top:1px solid var(--line);flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.ftxt{font-size:11px;color:var(--m3);text-align:center}
.h-fraunces{font-weight:600;letter-spacing:-.02em;line-height:1.06;color:var(--ink)}
.btn{height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px Inter;border:1px solid transparent;cursor:pointer;width:100%;background:none}
.btn.pri{background:var(--dark);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sec2{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:var(--field);color:var(--m3)}
.btn.sm{height:46px;font-size:14px}
.loc{display:flex;gap:8px;align-items:center;padding:2px 20px 12px;flex:0 0 auto}
.loc .l{flex:1;font-weight:500;font-size:13px}
.hero{background:var(--hero);border:1px solid var(--line);border-radius:26px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh-hero)}
.badge-sq{width:26px;height:26px;border-radius:9px;background:var(--dark);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.eyerow{display:flex;gap:8px;align-items:center}
.eyerow .tx{font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--m1)}
.ai-pill{display:inline-flex;gap:7px;align-items:center;align-self:flex-start;background:var(--hero);border-radius:999px;padding:7px 13px 7px 8px}
.ai-pill .sq{width:22px;height:22px;border-radius:7px;background:var(--dark);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ai-pill .tx{font-weight:600;font-size:12.5px;color:var(--ink)}
.cta{height:50px;display:inline-flex;gap:10px;align-items:center;padding:0 8px 0 22px;background:var(--dark);border-radius:999px;box-shadow:0 8px 20px -8px rgba(20,22,26,.5);border:0;cursor:pointer}
.cta .tx{font-weight:600;font-size:15px;color:var(--cream)}
.cta .arr{width:26px;height:26px;border-radius:999px;background:var(--lime);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.prog2{display:flex;gap:6px;align-items:center}.prog2 .dots{display:flex;gap:4px}.prog2 i{width:5px;height:5px;border-radius:999px;background:var(--dark)}
.prog2 .tx{font-weight:500;font-size:12px;color:var(--m1);white-space:nowrap}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.chip{height:36px;display:inline-flex;gap:7px;align-items:center;padding:0 15px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-card);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;flex:0 0 auto;cursor:pointer}
.chip.dark{background:var(--dark);border-color:var(--dark);color:var(--cream)}
.chip.sel{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.grid{display:flex;gap:14px;align-items:stretch}
.pcard{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--sh-prod)}
.photo{height:118px;border-radius:13px;position:relative;overflow:hidden;background:#eee}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fav{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:999px;z-index:2;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-card)}
.brand{font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--m3)}
.pname{font-weight:500;font-size:13px;line-height:1.3;color:var(--ink)}
.by{font-weight:500;font-size:11px;color:var(--m3)}
.tags{display:flex;gap:5px}.tag{padding:3px 8px;border-radius:999px;font-weight:600;font-size:10px;background:var(--chip);color:var(--m4)}.tag.cmr{background:var(--cmr-bg);color:var(--cmr-tx)}
.price{display:flex;gap:4px;align-items:baseline}.price .v{font-weight:600;font-size:21px;letter-spacing:-.01em;color:var(--ink)}.price .u{font-weight:600;font-size:11px;color:var(--m2)}
.proj{font-weight:500;font-size:11px;color:var(--m2)}
.nav{height:70px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:9px 10px 0;flex:0 0 auto}
.nav .it{width:58px;display:flex;flex-direction:column;gap:4px;align-items:center;position:relative}
.nav .it .lb{font-weight:600;font-size:10px;color:var(--m3)}.nav .it.on .lb{color:var(--ink)}
.nav .it .dot{width:5px;height:5px;border-radius:999px;background:#8bbf2e;position:absolute;top:-6px}
.ctx{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:9px 14px}
.ctx .t{flex:1;font-weight:500;font-size:12px;color:var(--m2)}
.ctx .e{font-weight:600;font-size:13px;color:var(--green);cursor:pointer}
.roomchips{display:flex;flex-direction:column;gap:10px}.roomrow{display:flex;gap:10px;flex-wrap:wrap}
.rchip{height:42px;display:flex;align-items:center;padding:0 18px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-card);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.rchip.sel{background:var(--lime);border-color:var(--lime)}
.field{background:#fff;border:1px solid var(--line);border-radius:14px;height:52px;display:flex;align-items:center;padding:0 16px;font-weight:500;font-size:15px}
.field.err{border-color:#e7000b}
.field input{border:0;outline:0;font:500 15px Inter;color:var(--ink);width:100%;background:none}
.photo-card{background:var(--field);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.estcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--sh-prod)}
.estcard .ph{height:150px;position:relative;overflow:hidden}.estcard .ph img{width:100%;height:100%;object-fit:cover}
.estcard .bd{padding:16px;display:flex;flex-direction:column;gap:11px}
.rowcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.crow{display:flex;align-items:center;gap:12px;padding:13px 15px}
.crow+.crow{border-top:1px solid var(--line)}
.crow .lbl{font-size:11px;color:var(--m3);margin-bottom:2px}
.crow .val{font-weight:600;font-size:14px;color:var(--ink)}
.crow .ch{font-weight:600;font-size:13px;color:var(--green);cursor:pointer}
.infobox{background:var(--hero);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.45;color:var(--m4)}
.infobox b{color:var(--ink)}
.warnbox{background:var(--warn-bg);border-radius:14px;padding:13px 15px;display:flex;gap:10px}
.warnbox .wt{font-weight:700;font-size:13.5px;color:#7a5e12;margin-bottom:3px}
.warnbox .wd{font-size:12.5px;line-height:1.45;color:#8a6d2f}
.optcard{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh-prod);display:flex;flex-direction:column}
.optcard .ph{height:168px;position:relative;overflow:hidden}.optcard .ph img{width:100%;height:100%;object-fit:cover}
.optcard .flag{position:absolute;top:14px;left:14px;background:var(--dark);color:var(--cream);font:700 10px Inter;letter-spacing:.06em;padding:6px 11px;border-radius:999px}
.optcard .bd{padding:16px;display:flex;flex-direction:column;gap:11px}
.why{background:var(--hero);border-radius:12px;padding:12px 14px}
.why .t{font-weight:700;font-size:12.5px;color:var(--ink);margin-bottom:4px}
.why .d{font-size:12.5px;line-height:1.45;color:var(--m4)}
.kititem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:12px;align-items:flex-start}
.kititem .thumb{width:52px;height:52px;border-radius:11px;overflow:hidden;flex:0 0 auto;background:#eee}
.kititem .thumb img{width:100%;height:100%;object-fit:cover}
.chk{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;background:var(--dark)}
.chk.off{background:#fff;border:1.5px solid var(--line)}
.req{display:inline-block;background:var(--req-bg);color:var(--req-tx);font:700 9.5px Inter;letter-spacing:.05em;padding:3px 8px;border-radius:999px;margin-bottom:5px}
.greenban{background:var(--cmr-bg);border-radius:14px;padding:12px 14px;display:flex;gap:9px;align-items:center}
.greenban .t{font-weight:700;font-size:13px;color:var(--green)}
.totrow{display:flex;align-items:baseline;justify-content:space-between}
.totrow .k{font-weight:500;font-size:14px;color:var(--ink)}
.totrow .v{font-weight:600;font-size:26px;letter-spacing:-.02em;color:var(--ink)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.stepper button{width:34px;height:34px;background:#fff;border:0;font-size:18px;color:var(--m2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper .v{min-width:30px;text-align:center;font-weight:700;font-size:14px;color:var(--ink)}
.optrow{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer}
.optrow .t{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:5px}
.optrow .d{font-size:12.5px;line-height:1.45;color:var(--m2)}
.toggle2{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--sh-card)}
.toggle2 button{flex:1;height:36px;border:0;background:none;border-radius:999px;font:600 13px Inter;color:var(--m3);cursor:pointer}
.toggle2 button.on{background:var(--field);color:var(--ink)}
.skel{background:linear-gradient(90deg,#edeff1 25%,#f6f7f9 50%,#edeff1 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:16px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--dark);border-radius:999px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

const {useState,useMemo} = React;
const A="assets/piso/";
const clp = n => "$"+Math.round(n).toLocaleString("es-CL");

const I = {

  heart:(c="#17191C",s=21)=><svg width={s} height={s} viewBox="0 0 15 15" fill="none"><path d="M7.49999 12.5C7.49999 12.5 3.12499 9.62499 3.12499 6.56249C2.87634 5.98232 2.86836 5.32715 3.10278 4.7411C3.3372 4.15505 3.79482 3.68613 4.37499 3.43749C4.95515 3.18884 5.61032 3.18086 6.19637 3.41528C6.78242 3.6497 7.25134 4.10732 7.49999 4.68749C7.74863 4.10732 8.21755 3.6497 8.8036 3.41528C9.38965 3.18086 10.0448 3.18884 10.625 3.43749C11.2051 3.68613 11.6628 4.15505 11.8972 4.7411C12.1316 5.32715 12.1236 5.98232 11.875 6.56249C11.875 9.62499 7.49999 12.5 7.49999 12.5Z" strokeWidth="1.125" strokeLinejoin="round" stroke={c}/></svg>,

// ===== Pricing model =====
const UNIT = { ppm2:8389, cajaM2:1.99, boxPrice:Math.round(1.99*8389), roll:15, rollPrice:11990, tira:2.4, tiraPrice:4490, perfil:12490 };
function calc(m2){
  const need=m2*1.10;
  const cajas=Math.max(1,Math.ceil(need/UNIT.cajaM2));
  const piso=cajas*UNIT.boxPrice;
  const rollos=Math.max(1,Math.ceil(m2/UNIT.roll));
  const espuma=rollos*UNIT.rollPrice;
  const w=Math.sqrt(m2*1.6),h=Math.sqrt(m2/1.6);const perim=Math.round((2*(w+h))*10)/10;
  const tiras=Math.max(1,Math.ceil(perim/UNIT.tira));
  const guarda=tiras*UNIT.tiraPrice;
  const perfil=UNIT.perfil;
  return {need,cajas,piso,rollos,espuma,perim,tiras,guarda,perfil,total:piso+espuma+guarda+perfil};
}

        <div style={{fontWeight:600,fontSize:17,color:"var(--ink)"}}>8 mm Floating Floor {o.name} <span style={{color:"var(--m3)"}}>{o.cajaM2.toString().replace(".",",")} m²</span></div>
        <div className="price"><span className="v serif" style={{fontSize:24}}>{clp(o.ppm2)}</span><span className="u">per m²</span></div>
        <div style={{fontSize:12,color:"var(--m2)"}}>{cajas} boxes of {o.cajaM2.toString().replace(".",",")} m² · includes 10% waste</div>
        <div className="why"><div className="t">Why we recommend it</div><div className="d">{o.why}</div></div>
        <div style={{fontSize:13,color:"var(--m2)"}}>Complete project: <b className="serif" style={{fontSize:16,color:"var(--ink)"}}>{clp(o.total)}</b></div>
        <button className="btn pri" onClick={()=>{setFloor(o);go(stockOk?"kit":"stockError");}}>Build this project</button>
        <button className="btn sec sm" onClick={()=>{setFloor(o);go("ar");}}>{I.eye()}See it in my living room</button>
      </div>
     </div>);})}
    <button className="btn sec">See all 142 living-room floors</button>
   </div>
  </div>);}

function AR({go,m2,floor}){const c=calc(m2);const cajas=Math.ceil(m2*1.1/(floor?.cajaM2||1.99));
  return(
  <div className="scr">
   <StatusBar/><StepTop label="See it in my living room" cart={1} onBack={()=>go("opciones")}/>
   <div className="scrbody">
    <div className="estcard"><div className="ph" style={{height:210}}><img src={A+"room-green.jpg"} alt=""/></div></div>
    <div className="toggle2"><button className="on">Your photo</button><button>Catalog setting</button></div>
    <div className="ai-pill"><span className="sq">{I.sparkle()}</span><span className="tx">Visualization generated by AI</span></div>
    <div style={{fontSize:13,color:"var(--m2)",lineHeight:1.5}}>It is a simulation of color and grain. The real tone may vary with your home's light.</div>
    <div className="brand">HOLZTEK</div>
    <div style={{fontWeight:600,fontSize:17}}>8 mm Floating Floor {floor?.name||"Oak Brown"} <span style={{color:"var(--m3)"}}>{(floor?.cajaM2||1.99).toString().replace(".",",")} m²</span></div>
    <div className="price"><span className="v serif" style={{fontSize:22}}>{clp(floor?.ppm2||8389)}</span><span className="u">per m²</span></div>
    <div style={{fontSize:12,color:"var(--m2)"}}>{cajas} boxes · includes 10% waste</div>
   </div>
   <div className="footer">
    <div className="totrow"><span className="k">Complete project</span><span className="v serif">{clp(floor?.total||c.total)}</span></div>
    <button className="btn pri" onClick={()=>go("kit")}>Build this project</button>
    <button className="btn sec" onClick={()=>go("opciones")}>Back to the 3 options</button>
   </div>
  </div>);}

function Kit({go,m2,floor,coverageOk}){
  const c=calc(m2);
  const items=[
    ["3 mm leveling underlay · 15 m² roll",c.rollos+" rolls · calculated from "+m2.toString().replace(".",",")+" m²",c.espuma],
    ["Pine skirting 2.4 m",c.tiras+" strips · estimated perimeter "+c.perim.toString().replace(".",",")+" m",c.guarda],
    ["Aluminum transition profile","1 unit · for the living-room doorway",c.perfil],
  ];
  return(
  <div className="scr">
   <StatusBar/><StepTop label="Step 3 of 3" onBack={()=>go("opciones")}/><Progress pct={100}/>
   <div className="scrbody">
    <div className="h-fraunces serif" style={{fontSize:25}}>Build your project</div>
    <div style={{fontSize:13,color:"var(--m2)",lineHeight:1.5}}>Living · {m2.toString().replace(".",",")} m² · floor {floor?.name||"Oak Brown"}. Quantities come from your measurements.</div>
    <div className="greenban">{I.checkC()}<span className="t">Everything required is selected</span></div>
    {items.map((it,i)=>(
     <div className="kititem" key={i}>
       <div className="chk">{I.check()}</div>
       <div className="thumb"><img src={A+"kit-roll.jpg"} alt=""/></div>
       <div style={{flex:1}}>
         <span className="req">REQUIRED</span>
         <div style={{fontWeight:600,fontSize:13.5,lineHeight:1.3}}>{it[0]}</div>
         <div style={{fontSize:12,color:"var(--m2)",margin:"3px 0 5px"}}>{it[1]}</div>
         <div style={{fontWeight:600,fontSize:15}}>{clp(it[2])}</div>
       </div>
     </div>))}
   </div>
   <div className="footer">
     <div className="totrow"><span className="k">Project total</span><span className="v serif">{clp(c.total)}</span></div>
     <div style={{fontSize:12,color:"var(--green)",fontWeight:500}}>All 3 required items are included. Your project is complete.</div>
     <button className="btn pri" onClick={()=>go(coverageOk?"carro":"sinCobertura")}>Add everything to cart</button>
   </div>
  </div>);}

function Carro({go,m2,floor}){
  const c=calc(m2);const cajas=c.cajas;
  const [q,setQ]=useState({piso:cajas,espuma:c.rollos,guarda:c.tiras,perfil:1});
  const prices={piso:UNIT.boxPrice,espuma:UNIT.rollPrice,guarda:UNIT.tiraPrice,perfil:UNIT.perfil};
  const total=Object.keys(q).reduce((s,k)=>s+q[k]*prices[k],0);
  const upd=(k,d)=>setQ(o=>({...o,[k]:Math.max(1,o[k]+d)}));
  const rows=[
    ["piso","8 mm Floating Floor "+(floor?.name||"Oak Brown"),"HOLZTEK · Color: "+(floor?.name||"Oak Brown")],
    ["espuma","3 mm leveling underlay","HOLZTEK · 15 m² roll"],
    ["guarda","Pine skirting 2.4 m","GENÉRICO"],
    ["perfil","Aluminum transition profile","GENÉRICO"],
  ];
  return(
  <div className="scr">
   <StatusBar/><StepTop label="Cart (4 products)" cart={4} onBack={()=>go("kit")}/>
   <div className="scrbody" style={{paddingTop:12}}>
    <div className="greenban"><span style={{flex:"0 0 auto"}}>{I.checkC()}</span><div><div className="t">Free shipping with Plus+!</div><div style={{fontSize:12,color:"var(--m2)"}}>Your project is over $49,990: shipping is free.</div></div></div>
    <div className="infobox" style={{display:"flex",flexDirection:"column",gap:3}}>
      <div style={{display:"flex",justifyContent:"space-between"}}><b>Project · Living {m2.toString().replace(".",",")} m²</b><span style={{color:"var(--green)",fontWeight:600}}>Edit</span></div>
      <div style={{fontSize:12.5}}>All 4 products are calculated for this space. If you change a quantity, the total recalculates.</div>
    </div>
    {rows.map(r=>(
     <div className="kititem" key={r[0]} style={{alignItems:"center"}}>
       <div className="chk" style={{width:22,height:22}}>{I.check("#fff",13)}</div>
       <div className="thumb"><img src={A+"kit-roll.jpg"} alt=""/></div>
       <div style={{flex:1}}>
         <div style={{fontWeight:600,fontSize:13,lineHeight:1.3}}>{r[1]}</div>
         <div style={{fontSize:11,color:"var(--m3)",margin:"2px 0 4px"}}>{r[2]}</div>
         <div style={{fontWeight:600,fontSize:14}}>{clp(q[r[0]]*prices[r[0]])}</div>
       </div>
       <div className="stepper"><button onClick={()=>upd(r[0],-1)}>−</button><span className="v">{q[r[0]]}</span><button onClick={()=>upd(r[0],1)}>+</button></div>
     </div>))}
   </div>
   <div className="footer">
     <div className="totrow"><span className="k" style={{fontWeight:600}}>Total:</span><span className="v serif">{clp(total)}</span></div>
     <button className="btn pri">Continue to checkout</button>
   </div>
  </div>);}

function Branch({label,title,sub,opts,cta,onBack,pct,warn}){return(
  <div className="scr">
   <StatusBar/><StepTop label={label} cart={1} onBack={onBack}/>{pct&&<Progress pct={pct}/>}
   <div className="scrbody" style={{paddingTop:12}}>
     {warn&&<div className="warnbox"><div style={{flex:"0 0 auto"}}>{I.warn()}</div><div><div className="wt">{warn[0]}</div><div className="wd">{warn[1]}</div></div></div>}
     {title&&<div className="h-fraunces serif" style={{fontSize:24}}>{title}</div>}
     {sub&&<div style={{fontSize:13,color:"var(--m2)",lineHeight:1.5}}>{sub}</div>}
     {opts.map((o,i)=>(<div className="optrow" key={i}><div className="t">{o[0]}</div><div className="d">{o[1]}</div></div>))}
   </div>
   <div className="footer" style={{gap:10}}>{cta.map((b,i)=>(<button key={i} className={"btn "+(i===0?"pri":"sec")}>{b}</button>))}</div>
  </div>);}

// ===== App =====
const STEPS=[["entrada","Start"],["paso1","Space"],["condiciones","Conditions"],["opciones","Options"],["kit","Kit"],["carro","Cart"]];
const STEPIDX={entrada:0,paso1:1,estimando:1,foto:1,fotoError:1,condiciones:2,sinCoincidencias:2,opciones:3,ar:3,stockError:3,kit:4,sinCobertura:4,carro:5};
const CAPS={
 entrada:<>Hero in the flooring listing. <b>Start</b> opens the assistant — AI is the precondition for the whole flow.</>,
 paso1:<>Step 1 — pick the space and set the <b>m²</b>: by photo (AI estimate) or by hand. Nothing advances without the measurement.</>,
 estimando:<>AI estimates the m² from the photo. You can cancel and measure by hand.</>,
 foto:<>The photo gives an <b>editable</b> m², marked as AI-generated and with the margin of error explicit: the boxes come from this number.</>,
 fotoError:<>Real state: if the photo fails, the flow doesn't break — it offers retry or manual input, without losing the project.</>,
 condiciones:<>Step 2 — traffic, humidity and pets are <b>derived</b> from the space; the user confirms or corrects before seeing floors.</>,
 opciones:<>Step 3 — three <b>complete projects</b> (not loose floors) with a final price and the why behind each recommendation.</>,
 ar:<>AR branch — preview the floor on your own photo before deciding.</>,
 kit:<>The <b>kit is calculated from your measurements</b> (underlay by rolls, skirting by perimeter). Change the m² and watch it recalculate.</>,
 carro:<>The cart keeps the project context and <b>recalculates the total</b> when you edit any quantity.</>,
 sinCoincidencias:<>Real state — if no option qualifies (wet bathroom + exterior), it offers ways out instead of an empty result.</>,
 stockError:<>Real state — insufficient stock: reserve, switch to an equivalent, or store pickup.</>,
 sinCobertura:<>Real state — no installation coverage: the click kit allows self-installation.</>,
};
function App(){
  const [screen,setScreen]=useState("entrada");
  const [m2,setM2]=useState(0);
  const [room,setRoom]=useState("Living");
  const [floor,setFloor]=useState(null);
  const [photoOk,setPhotoOk]=useState(true);
  const [stockOk,setStockOk]=useState(true);
  const [coverageOk,setCoverageOk]=useState(true);
  const go=s=>{document.querySelector(".scrbody")?.scrollTo(0,0);setScreen(s);};
  const reset=()=>{setScreen("entrada");setM2(0);setRoom("Living");setFloor(null);};
  React.useEffect(()=>{window.__nav=(s,o={})=>{if(o.m2!=null)setM2(o.m2);if(o.room)setRoom(o.room);if(o.floor)setFloor(o.floor);setScreen(s);};},[]);
  const idx=STEPIDX[screen]??0;
  const P={go,m2,setM2,room,setRoom,floor,setFloor,photoOk,stockOk,coverageOk};
  const screens={
    entrada:<Entrada {...P}/>,paso1:<Paso1 {...P}/>,estimando:<Estimando {...P}/>,foto:<Foto {...P}/>,
    fotoError:<FotoError {...P}/>,condiciones:<Condiciones {...P}/>,opciones:<Opciones {...P}/>,ar:<AR {...P}/>,
    kit:<Kit {...P}/>,carro:<Carro {...P}/>,
    sinCoincidencias:<Branch label="Your options" onBack={()=>go("condiciones")} title="No floor meets all 4 conditions" sub="Permanent humidity plus outdoor use rules out the entire floating-floor catalog. Here are your ways out:" opts={[["Switch to porcelain","It's the category built for humidity and outdoors. 84 options qualify and we keep your calculation."],["Drop the outdoor condition","If the bathroom is covered, there are 12 water-resistant floating floors that work."]]} cta={["See the 84 porcelain options","Change my answers"]}/>,
    stockError:<Branch label="Your 3 options" cart={1} onBack={()=>go("opciones")} warn={["7 of the 11 boxes you need are left","There is only stock for 13.9 m² of the "+m2.toString().replace(".",",")+" m² of your project. Buying too few means stopping the install halfway."]} opts={[["Reserve the 7 and wait for the other 4","They arrive Aug 22. The floor is installed in one go, so it's worth waiting for the full batch."],["Switch to Tecnoxpert Moka","Full stock for your "+m2.toString().replace(".",",")+" m². It was your second option and meets the same conditions."],["Store pickup","Sodimac La Reina has all 11 boxes available today."]]} cta={["Switch to Tecnoxpert Moka"]}/>,
    sinCobertura:<Branch label="Installation" cart={1} onBack={()=>go("kit")} warn={["We don't install in your district","The install service covers 23 districts of the Metropolitan Region and yours isn't one of them. Materials do ship with no problem."]} opts={[["Take it with the install kit","We add wedges, a tapping block and transition profile to the project. The click system needs no glue or power tools."],["Find an installer yourself","We send you the product's technical guide to pass on to whoever installs it."]]} cta={["Continue with the install kit"]}/>,
  };
  // stockError CTA → kit ; sinCobertura CTA → carro ; sinCoincidencias handled as dead-ends for demo
  return(
   <div className="rig">
    <div className="rig-head">
      <div><p className="eyebrow">Falabella · Sodimac · Interactive prototype</p>
        <h1>Piso Ideal — shopping assistant</h1>
        <p>The real assistant flow: you define your space, AI estimates the m², and you get a complete project —flooring + a kit calculated from your measurements— with a final price before the cart. Built with the real tokens, icons and screens from Figma.</p></div>
      <button className="reset-btn" onClick={reset}>↺ Reset</button>
    </div>
    <div className="panel">
      <div className="steps">{STEPS.map(([k,l],i)=>(
        <React.Fragment key={k}><div className={"step"+(i===idx?" on":"")+(i<idx?" done":"")}><span className="num">{i<idx?"✓":i+1}</span><span className="lbl">{l}</span></div>{i<STEPS.length-1&&<div className="step-sep"></div>}</React.Fragment>))}</div>
      <div className="scn">
        <div className="sw" onClick={()=>setPhotoOk(v=>!v)}><span className="k">Photo readable</span><span className={"toggle"+(photoOk?" on":"")}></span></div>
        <div className="sw" onClick={()=>setStockOk(v=>!v)}><span className="k">Full stock</span><span className={"toggle"+(stockOk?" on":"")}></span></div>
        <div className="sw" onClick={()=>setCoverageOk(v=>!v)}><span className="k">Install coverage</span><span className={"toggle"+(coverageOk?" on":"")}></span></div>
      </div>
    </div>
    <div className="stage">
      <div className="phone-wrap"><div className="phone"><div className="notch"></div>{screens[screen]}</div></div>
      <p className="caption">{CAPS[screen]}</p>
    </div>
    <p className="footnote">Functional prototype on the real Sodimac/Falabella design system. Data is for demo; the recalculation (m² → kit → total) is live. Toggle the switches to see the real error states.</p>
   </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
